version: '3.9'

services:
  app:
    build: .
    container_name: video-ai-app
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS}
      - DATABASE_PATH=/app/database.sqlite3
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/output
      - LOGS_DIR=/app/logs
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./database.sqlite3:/app/database.sqlite3
      - ./temp:/app/temp
      - ./output:/app/output
      - ./logs:/app/logs
    ports:
      - "8000:8000"  # Health check server
      - "5000:5000"  # Admin API (optional)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: video-ai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis-data: