
services:
  app:
    build: .
    container_name: video-ai-app
    restart: always
    command: python scripts/run_bot.py --db /app/database.sqlite3 --admin 7164535840
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/database.sqlite3
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/output
      - LOGS_DIR=/app/logs
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://localhost:6379/0
    network_mode: host
    volumes:
      - db-data:/app/data
      - ./temp:/app/temp
      - ./output:/app/output
      - ./logs:/app/log
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    container_name: video-ai-web
    restart: always
    # Same image as `app`; just runs the FastAPI web UI instead of the
    # Telegram bot. Shares the same volumes so it can read/write the same
    # temp/output files and (by default) the same sqlite DB file.
    command: python scripts/run_web.py
    env_file:
      - .env
    environment:
      - WEB_DB_PATH=/app/temp/database.sqlite3
      - TEMP_DIR=/app/temp
      - LOGS_DIR=/app/logs
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://localhost:6379/0
      - WEB_PORT=8080
    network_mode: host
    volumes:
      - ./temp:/app/temp
      - ./output:/app/output
      - ./logs:/app/log
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: video-ai-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - video-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  video-ai-network:
    driver: bridge

volumes:
  db-data:
  redis-data: