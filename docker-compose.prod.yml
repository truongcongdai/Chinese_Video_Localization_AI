version: '3.9'

services:
  app:
    build: .
    container_name: video-ai-app
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS}
      - DATABASE_PATH=/app/database.sqlite3
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/output
      - LOGS_DIR=/app/logs
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./database.sqlite3:/app/database.sqlite3
      - ./temp:/app/temp
      - ./output:/app/output
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    container_name: video-ai-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  database:
  temp:
  output:
  logs: