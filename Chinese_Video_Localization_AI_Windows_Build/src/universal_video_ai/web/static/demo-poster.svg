<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Video Localization AI demo</title>
  <desc id="desc">Before and after localization preview</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="26" fill="url(#bg)"/>
  <rect x="48" y="52" width="568" height="616" rx="22" fill="#171b26" stroke="#374151"/>
  <rect x="664" y="52" width="568" height="616" rx="22" fill="url(#after)" opacity=".9"/>
  <text x="86" y="112" fill="#94a3b8" font-family="Arial,sans-serif" font-size="24" font-weight="700">BEFORE · SOURCE</text>
  <text x="702" y="112" fill="#d1fae5" font-family="Arial,sans-serif" font-size="24" font-weight="700">AFTER · LOCALIZED</text>
  <circle cx="332" cy="330" r="104" fill="#252b39"/>
  <path d="M305 270l92 60-92 60z" fill="#64748b"/>
  <circle cx="948" cy="330" r="104" fill="#ffffff" opacity=".16"/>
  <path d="M921 270l92 60-92 60z" fill="#fff"/>
  <rect x="732" y="516" width="432" height="74" rx="18" fill="#070b14" opacity=".82"/>
  <text x="948" y="562" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700">Translated subtitle + AI voice</text>
  <rect x="522" y="324" width="236" height="52" rx="26" fill="#6366f1"/>
  <text x="640" y="358" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">AI LOCALIZATION</text>
</svg>
