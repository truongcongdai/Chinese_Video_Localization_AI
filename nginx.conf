user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream to the WEB UI container (FastAPI app, port 8080) — NOT the
    # Telegram bot's bare health-check server on port 8000 (that one only
    # answers "Telegram Bot Running" on `/` and has no login page / API).
    # `app`/`web` run with `network_mode: host` in docker-compose.prod.yml,
    # so there is no docker-compose DNS between services here; if this
    # nginx also runs as a container it must join the host network too
    # (or run nginx directly on the host), and reach the web UI via
    # 127.0.0.1.
    upstream video_ai_app {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://video_ai_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://video_ai_app/health;
        }
    }
}